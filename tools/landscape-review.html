<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archived landscape comparison · Defender</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#121816;color:#eee8d9}*{box-sizing:border-box}body{margin:0;padding:20px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:30px Georgia,serif;margin:0 0 8px}p{color:#a8b7aa;margin:0;line-height:1.6}a{color:#bbc9a2}canvas{width:100%;height:calc(100vh - 210px);min-height:360px;display:block;border:1px solid #3b4b3d;border-radius:8px;margin-top:16px;touch-action:none;cursor:grab}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}button,select{font:inherit;background:#263629;color:#eee8d9;border:1px solid #53664c;border-radius:5px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#39522d;border-color:#91b974}button:disabled{opacity:.5}#status{font-size:12px;color:#bbcca4}#error{color:#ed9375;white-space:pre-wrap}footer{font-size:11px;color:#8d9d90}
</style></head><body>
<header><div><h1 id="heading">Archived landscape comparison</h1><p id="stage-label">Previous landscape baseline · Before the fixed-size reset</p></div><a href="/docs/design-doc#landscape-first-level-design">Design doc ↗</a></header>
<canvas id="scene" tabindex="0" aria-label="Landscape comparison. Drag to orbit, right drag to pan, scroll to zoom."></canvas>
<div class="controls"><label for="level">Level</label><select id="level" disabled></select><button id="before" disabled aria-pressed="true">Previous landscape</button><button id="after" disabled aria-pressed="false">Previous carved layout</button><button id="night" disabled aria-pressed="false">Night</button><button id="frame" disabled>Frame landscape</button><span id="status" role="status">Loading…</span><a id="game-link" href="/game/?inspect">Current landscape preview ↗</a></div>
<p id="error" role="alert"></p><footer>Drag to orbit · Right drag / WASD to pan · Scroll to zoom. Historical before/after views. Current levels are fixed-size landscapes without paths or enemies.</footer>
<script id="review-diagnostics" type="application/json">{"ready":false}</script><script type="module" src="/tools/landscape-review.js"></script></body></html>
