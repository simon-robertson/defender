<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power link review · Defender</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#121816;color:#eee8d9}*{box-sizing:border-box}body{margin:0;padding:20px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:32px Georgia,serif;font-weight:400;margin:0 0 8px}p{color:#a8b7aa;margin:0;line-height:1.6}a{color:#bbc9a2}canvas{width:100%;height:calc(100vh - 225px);min-height:360px;display:block;border:1px solid #3b4b3d;border-radius:8px;margin-top:18px;touch-action:none;cursor:grab}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}label{display:flex;align-items:center;gap:8px}button{font:inherit;background:#263629;color:#eee8d9;border:1px solid #53664c;border-radius:5px;padding:8px 10px;cursor:pointer}button[aria-pressed=true]{background:#39522d;border-color:#91b974}button:disabled,input:disabled{opacity:.5}#status{font-size:12px;color:#bbcca4}#error{color:#ed9375;white-space:pre-wrap}footer{font-size:11px;color:#8d9d90}input[type=range]{width:130px}
</style></head><body>
<header><div><h1>Power link</h1><p>Zone A · Level 1 · Generator → adjacent turret · Strength +25%</p></div><a href="/game/?inspect">Game preview ↗</a></header>
<canvas id="scene" tabindex="0" aria-label="Power generator plasma connection. Drag to orbit, right drag to pan, scroll to zoom."></canvas>
<div class="controls"><button id="night" disabled aria-pressed="false">Night</button><button id="close" disabled>Close view</button><button id="overview" disabled>Overview</button><button id="effect" disabled aria-pressed="true">Link on</button><button id="play" disabled aria-pressed="true">Pause</button><label>Snapshot<input id="time" type="range" min="0" max="4000" step="50" value="0" disabled><output id="time-label">0.00 s</output></label><span id="status" role="status">Loading…</span></div>
<p id="error" role="alert"></p><footer>Drag to orbit · Right/Shift drag or WASD to pan · Scroll to zoom · N for day/night. Existing models and level; inspection controls do not change saved content.</footer>
<script id="review-diagnostics" type="application/json">{"ready":false}</script><script type="module" src="/tools/power-link-review.js"></script></body></html>
