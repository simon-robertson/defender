<!doctype html><html lang="en"><meta charset="utf-8"><title>Flying enemy turns</title><style>
*{box-sizing:border-box}body{margin:0;background:#19241e;color:#e5e9db;font:14px system-ui}header{height:60px;display:flex;align-items:center;gap:12px;padding:12px}button,select,input{font:inherit}button,select{padding:7px;background:#dce3cf;color:#18221c;border:0}canvas{display:block;width:100vw;height:calc(100vh - 110px)}output{display:block;padding:12px;font-size:13px}label{display:flex;align-items:center;gap:6px}#phase{width:180px}</style>
<header><strong>Flying enemy turns</strong><select id="model"><option value="moth">Moth</option><option value="twin-fan">Twin Fan</option><option value="ray">Ray</option><option value="lantern">Lantern</option></select><button id="pause">Pause</button><button id="left">Left turn</button><button id="right">Right turn</button><button id="view">Overview</button><label>Route <input id="phase" type="range" min="0" max="288" value="60" step="0.25"></label></header>
<canvas id="world"></canvas><output id="status">Loading</output><script type="module" src="/tools/flying-turns-review.js"></script></html>
